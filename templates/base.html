<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}{{ config.title }}{% endblock title %}</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <nav id="compass">
            <a href="/"
               class="compass-link {% if current_path == '/' %}current{% endif %}">home</a>
            <a href="/about"
               class="compass-link {% if current_path == '/about/' %}current{% endif %}">about</a>
            <a href="/blog"
               class="compass-link {% if '/blog/' in current_path %}current{% endif %}">blog</a>
            <a href="/contact"
               class="compass-link {% if current_path == '/contact/' %}current{% endif %}">contact</a>
            <a href="/favorites"
               class="compass-link {% if current_path == '/favorites/' %}current{% endif %}">favorites</a>
        </nav>
        <div id="wrapper">
            <section class="section">
                <div class="container">
                    {% block content %}
                    {% endblock content %}
                </div>
            </section>
        </div>
        <!-- Colors menu links for pages visited during this visit (resets when the tab closes) -->
        <script>
            // Treat "/about" and "/about/" as the same page
            function clean(path) { return path.replace(/\/+$/, "") || "/"; }

            // Load the list of pages seen so far, and add this one
            var seen = JSON.parse(sessionStorage.getItem("seen") || "[]");
            var here = clean(location.pathname);
            if (!seen.includes(here)) {
                seen.push(here);
                sessionStorage.setItem("seen", JSON.stringify(seen));
            }

            // Mark each menu link whose page is on the list
            document.querySelectorAll(".compass-link").forEach(function (link) {
                if (seen.includes(clean(new URL(link.href).pathname))) {
                    link.classList.add("seen");
                }
            });
        </script>
    </body>
</html>
