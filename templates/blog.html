{% extends "base.html" %}
{% block content %}
    <h1 class="title">{{ section.title }}</h1>
    {{ section.content | safe }}
    {% for page in section.pages %}
        <div class="post-card">
            <p class="post-date">{{ page.date }}</p>
            <h2 class="post-title"><a href="{{ page.permalink | safe }}">{{ page.title }}</a></h2>
            {% if page.description %}<p class="post-preview">{{ page.description }}</p>{% endif %}
        </div>
    {% endfor %}
{% endblock content %}
